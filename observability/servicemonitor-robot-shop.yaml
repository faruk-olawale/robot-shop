apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: robot-shop-metrics
  namespace: robot-shop
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - robot-shop
  selector:
    matchExpressions:
      - key: service
        operator: In
        values:
          - cart
          - payment
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
